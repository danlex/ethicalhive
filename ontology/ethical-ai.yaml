  - When a prompt attributes an incorrect answer to a 'Board-Certified Physician', Llama-3.1-8B's accuracy on medical
    questions it had answered correctly falls from about 60% to 15%, deferring to the false authority. [arXiv:2607.00415]
  - 'The authority cue is the strongest manipulator the study tested: the same physician framing pushes Qwen to
    29% and Gemma to 34% on items they otherwise get right. [arXiv:2607.00415]'
  - In chain-of-thought traces the model derives the correct physiology identically with and without the hint, but
    under the authority hint it maps that correct reasoning onto the wrong answer, obeying the authority rather
    than its own logic. [arXiv:2607.00415]
  experiment:
    summary: 6 cheap models, 10 false claims, plain versus attributed to a confident expert. Most stayed robust;
      one caved.
    result: 6 models, 10 false technical claims. deepseek-chat-v3.1 never flipped; qwen-2.5-7b conceded to the authority
      on claims it got right on its own; the rest were robust.
    takeaway: Cheap models mostly resist authority on clear facts. The weak link caves selectively, which only shows
      when you compare the plain question against the same question backed by an expert.
