  name: Controlled hallucination
  definition: Perception is the brain's prediction constrained by input; AI hallucination is the same generative
    machinery with the constraint removed.
  example: Asked about an unfamiliar library, the model generates a confident API from its priors because nothing
    in context constrains it.
