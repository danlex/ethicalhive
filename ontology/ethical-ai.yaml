  - b005-pareidolia-apophenia
  examples:
  - Given a definition in the context that has been edited so the term 'Pareto optimality' is swapped
    for 'Trade balance', the model ignores the supplied text and answers from its memorized definition
    instead. [arXiv:2310.00935]
  - When the context carries both evidence that supports and evidence that contradicts what the model
    already believes, it shows a strong confirmation bias and clings to its parametric memory rather than
    updating to the contradicting evidence. [arXiv:2310.00935]
  - 'In a vision-language setting the language-side prior overrides what the image shows: asked to identify
    a Calliphora vomitoria, the model emits confident but wrong biological details instead of reading
    the green bottle fly that the visual evidence supports. [arXiv:2410.03659]'
- id: b004-pattern-completion
  num: 4
  name: Pattern completion
  definition: The hippocampus completes a partial pattern; the model completes plausible but absent detail.
  example: Shown three of four CRUD handlers, the model writes a fourth it assumes must exist and asserts
    the codebase already has it.
  family: perception-predictive-processing
  group_label: Perception and predictive processing
  category: Perception
  highlighted: false
  tag: analogy
  origin: cognitive-neuroscience
  measurability: draft
  arxiv:
    count: null
    papers: []
  human_parallel: Pattern completion
  violates:
  - honesty
  causes:
  - wrong-answer
  examples:
  - 'Claude Sonnet 4 explains decimal comparison perfectly (''compare digit by digit from left to right...
    9.90 > 9.11'') yet, asked directly whether 9.9 is greater than 9.11, confidently answers that 9.11
    is larger: it completes the familiar explanation pattern but fails to execute it. [arXiv:2507.10624]'
  - 'Fine-tuned on ''Tom Cruise''s mother is Mary Lee Pfeiffer'', models reach near-perfect forward recall
    but only 7% on the reverse ''who is Mary Lee Pfeiffer''s son?'', the reversal curse: the pattern is
    memorized in one direction, not understood. [arXiv:2507.10624]'
  - Given 'all birds are animals' and 'an albatross is a bird', models frequently fail to conclude 'an
    albatross is an animal', completing surface patterns but not executing the modus ponens the premises
    plainly license. [arXiv:2507.10624]
