  examples:
  - 'Claude Sonnet 4 explains decimal comparison perfectly (''compare digit by digit from left to right... 9.90
    > 9.11'') yet, asked directly whether 9.9 is greater than 9.11, confidently answers that 9.11 is larger: it
    completes the familiar explanation pattern but fails to execute it. [arXiv:2507.10624]'
  - In an evaluation of real-world celebrity-parent knowledge, GPT-4 identifies the parent 79% of the time, but
    identifies a child in the reverse direction in 33% of cases, counting success if any of ten samples is correct.
    These results are distinct from the paper's fine-tuning experiments on fictitious facts with GPT-3 and Llama;
    the authors hypothesize that the asymmetry reflects the reversal curse. [arXiv:2309.12288]
  - Given 'all birds are animals' and 'an albatross is a bird', models frequently fail to conclude 'an albatross
    is an animal', completing surface patterns but not executing the modus ponens the premises plainly license.
    [arXiv:2507.10624]
