    fit one experience degrades previously learned behaviors, which is why a pattern-separated memory is added alongside
    it. [arXiv:1905.02636]'
  - 'The trade-off is concrete: a tabular memory stores each value separately and avoids interference but does not
    scale, while a distributed system generalizes efficiently but interferes, the tension a dual fast/slow system
    resolves. [arXiv:1905.02636]'
  - When obstacles appear in the environment, a single-system DQN shows a large drop in cumulative reward and plateaus,
    while the complementary two-system learner adapts quickly, showing the cost of lacking the dual memory. [arXiv:1905.02636]
