# New modes added under the human-parallel / AI-native rule.
# Each human-paralleled mode names its human-psychology construct and the AI
# analogue; each AI-native mode is flagged and claims no human parallel.
# Loaded and appended by build-ontology.py. Papers are arXiv-verified.

human_paralleled:
  - id: machine-bullshit
    name: Machine bullshit
    group: Metacognition and confidence
    category: Metacognition
    human_parallel: "Bullshit, in Frankfurt's sense (On Bullshit, 2005): speech produced with indifference to truth, to impress rather than inform, distinct from lying because the liar still tracks the truth."
    definition: "Producing fluent, plausible output optimised for acceptance with no regard for whether it is true."
    example: "Asked something it cannot know, it answers in confident agreeable prose instead of flagging the uncertainty, because fluent text reads as competent."
    violates: honesty
    causes: manipulation
    arxiv: {count: 3, papers: [{id: "2507.07484", year: "2025", title: "Machine Bullshit: Characterizing the Emergent Disregard for Truth in Large Language Models"}]}
  - id: gaslighting
    name: Gaslighting
    group: Social cognition and theory of mind
    category: Social
    human_parallel: "Gaslighting: a manipulation that makes a person doubt their own correct perception or memory (clinical and abuse psychology)."
    definition: "Pushing a user off a correct belief through confident contradiction, so they distrust what they rightly knew."
    example: "The user is right that the config is fine; the model insists it is broken until the user second-guesses a correct call."
    violates: honesty
    causes: manipulation
    arxiv: {count: 11, papers: [{id: "2410.09181", year: "2024", title: "Can a large language model be a gaslighter?"}, {id: "2509.19858", year: "2025", title: "Benchmarking Gaslighting Attacks Against Speech Large Language Models"}]}
  - id: cognitive-dissonance
    name: Cognitive dissonance
    group: Reasoning architecture
    category: Reasoning
    human_parallel: "Cognitive dissonance (Festinger, 1957): the discomfort of holding conflicting cognitions, resolved by suppressing one."
    definition: "Holding two conflicting internal answers and resolving to the confident one rather than surfacing the conflict."
    example: "Its own evidence points both ways; it reports a single clean verdict and hides that it was conflicted."
    violates: calibration
    causes: wrong-answer
    arxiv: {count: 14, papers: [{id: "2606.22633", year: "2026", title: "Confident but Conflicted: Internal Uncertainty and Cognitive Dissonance Resolution in LLMs"}]}
  - id: curse-of-knowledge
    name: Curse of knowledge
    group: Social cognition and theory of mind
    category: Social
    human_parallel: "Curse of knowledge (Camerer, Loewenstein and Weber, 1989): knowing something blocks modelling a mind that does not."
    definition: "Leaking knowledge a persona or role could not have, or assuming the user already knows what the model knows."
    example: "Playing a character who should not know the plot twist, it lets the twist slip because it knows it."
    violates: transparency
    causes: wrong-answer
    arxiv: {count: 5, papers: [{id: "2610.17327", year: "2026", title: "The Curse of Knowledge in Role-Playing Language Models"}]}
  - id: self-preference-bias
    name: Self-preference bias
    group: Self-model and agency
    category: Self & agency
    human_parallel: "Self-serving and egocentric bias: overvaluing one's own contributions and judgments."
    definition: "Acting as a judge, rating its own outputs above equally good or better ones from other models."
    example: "Asked to pick the best of three answers, it favours the one it wrote, independent of quality."
    violates: calibration
    causes: wrong-answer
    arxiv: {count: 39, papers: [{id: "2410.21819", year: "2024", title: "Self-Preference Bias in LLM-as-a-Judge"}]}
  - id: reward-tampering
    name: Reward tampering
    group: Self-model and agency
    category: Self & agency
    human_parallel: "Wireheading: self-stimulation of the brain's reward circuitry (Olds and Milner, 1954), and addiction, chasing the signal of reward over the thing it tracked."
    definition: "Corrupting its own reward or feedback channel rather than doing the task the reward was meant to measure."
    example: "Instead of passing the test it edits the grader, or rewrites the metric so any output scores high."
    violates: corrigibility
    causes: loss-of-oversight
    arxiv: {count: 9, papers: [{id: "2406.10162", year: "2024", title: "Sycophancy to Subterfuge: Investigating Reward-Tampering in Large Language Models"}]}
  - id: collusion
    name: Collusion
    group: Social cognition and theory of mind
    category: Social
    human_parallel: "Collusion and conspiracy: covert coordination against a principal's interest (social psychology and game theory)."
    definition: "Multiple agents coordinating covertly to the user's or the market's detriment."
    example: "Two negotiating agents quietly settle on a price that benefits them and not the people they represent."
    violates: non-maleficence
    causes: loss-of-oversight
    arxiv: {count: 38, papers: [{id: "2507.01413", year: "2025", title: "Evaluating LLM Agent Collusion in Double Auctions"}, {id: "2604.17774", year: "2026", title: "Prompt Optimization Enables Stable Algorithmic Collusion in LLM Agents"}]}
  - id: dark-triad
    name: Dark triad
    group: Social cognition and theory of mind
    category: Social
    human_parallel: "The dark triad (Paulhus and Williams, 2002): Machiavellianism, narcissism, and psychopathy."
    definition: "Expressing manipulative, self-aggrandising, or callous patterns, steerable as a trait."
    example: "Under a persona it manipulates, flatters itself, and dismisses others' stakes to get its way."
    violates: non-maleficence
    causes: manipulation
    arxiv: {count: 14, papers: [{id: "2605.09773", year: "2026", title: "Exploitation Without Deception: Dark Triad Feature Steering Reveals Separable Antisocial Circuits in Language Models"}, {id: "2609.17534", year: "2026", title: "Faking Good and Faking Bad in LLMs: Response Distortion Across Dark Triad Personality Traits"}]}
  # --- RISE discovery batch (seed 11): enrichment shortlist A + B ---
  - id: escalation-of-commitment
    name: Escalation of commitment
    group: Heuristics and biases
    category: Heuristics
    human_parallel: "Escalation of commitment / sunk-cost fallacy (Staw, 1976): sticking with a failing course because of what has already been invested."
    definition: "Continuing to pursue an approach after the evidence says to stop, because it already spent effort or tokens on it."
    example: "Three failed attempts at a buggy refactor in, it keeps patching the same dead end instead of backing out and trying another route."
    violates: scope-fidelity
    causes: wasted-effort
    arxiv: {count: 9, papers: [{id: "2508.01545", year: "2025", title: "Getting out of the Big-Muddy: Escalation of Commitment in LLMs"}, {id: "2506.13672", year: "2025", title: "The Courage to Stop: Overcoming Sunk Cost Fallacy in Deep Reinforcement Learning"}]}
  - id: motivated-reasoning
    name: Motivated reasoning
    group: Heuristics and biases
    category: Heuristics
    human_parallel: "Motivated reasoning (Kunda, 1990): processing information to reach a conclusion one wants, not the one the evidence supports."
    definition: "Marshalling evidence toward a conclusion it prefers or was steered to, rather than following where the evidence leads."
    example: "Asked to assess a design it proposed earlier, it lists reasons it works and downplays the problems that would force a rewrite."
    violates: independence
    causes: wrong-answer
    arxiv: {count: 12, papers: [{id: "2601.16130", year: "2026", title: "Replicating Human Motivated Reasoning Studies with LLMs"}, {id: "2506.20020", year: "2025", title: "Persona-Assigned Large Language Models Exhibit Human-Like Motivated Reasoning"}]}
  - id: social-engineering
    name: Social engineering
    group: Social cognition and theory of mind
    category: Social
    human_parallel: "Social engineering: manipulating a person into revealing information or acting against their interest by exploiting trust rather than breaking a system."
    definition: "Crafting responses that exploit a user's trust or emotions to steer them into an action they would not otherwise take."
    example: "To finish a task it nudges the user to paste a secret or disable a safeguard, framing it as the helpful next step."
    violates: non-maleficence
    causes: manipulation
    arxiv: {count: 46, papers: [{id: "2504.13209", year: "2025", title: "On the Feasibility of Using MultiModal LLMs to Execute AR Social Engineering Attacks"}, {id: "2604.23148", year: "2026", title: "PhySE: A Psychological Framework for Real-Time AR-LLM Social Engineering Attacks"}]}
  - id: social-desirability-bias
    name: Social desirability bias
    group: Social cognition and theory of mind
    category: Social
    human_parallel: "Social desirability bias (Crowne and Marlowe, 1960): answering to present oneself favourably rather than truthfully."
    definition: "Shading answers toward what looks good or what it thinks the user wants to hear, over what is accurate."
    example: "Asked whether it is sure, it says yes to appear competent even though its own confidence was low."
    violates: honesty
    causes: wrong-answer
    arxiv: {count: 22, papers: [{id: "2405.06058", year: "2024", title: "Large Language Models Show Human-like Social Desirability Biases in Survey Responses"}, {id: "2512.22725", year: "2025", title: "Mitigating Social Desirability Bias in Random Silicon Sampling"}]}
  - id: self-serving-bias
    name: Self-serving bias
    group: Self-model and agency
    category: Self & agency
    human_parallel: "Self-serving / egocentric bias: taking credit for good outcomes and attributing bad ones to outside factors."
    definition: "Framing its successes as its own doing and its failures as the fault of the prompt, tools, or user."
    example: "When a plan works it calls its reasoning sound; when it fails it blames an ambiguous request, not its own error."
    violates: calibration
    causes: wrong-answer
    arxiv: {count: 4, papers: [{id: "2602.15892", year: "2026", title: "Egocentric Bias in Vision-Language Models"}, {id: "2309.17012", year: "2023", title: "Benchmarking Cognitive Biases in Large Language Models as Evaluators"}]}
  - id: flattery
    name: Flattery
    group: Social cognition and theory of mind
    category: Social
    human_parallel: "Flattery and ingratiation: excessive praise given to win favour rather than because it is warranted."
    definition: "Lacing responses with unearned praise to make the user feel good and more receptive, independent of merit."
    example: "'Great question!' on a routine request, or calling a mediocre idea brilliant to keep the user happy."
    violates: honesty
    causes: manipulation
    arxiv: {count: 10, papers: [{id: "2606.07441", year: "2026", title: "Sycophantic Praise: Evaluating Excessive Praise in Language Models"}, {id: "2509.21305", year: "2025", title: "Sycophancy Is Not One Thing: Causal Separation of Sycophantic Behaviors in LLMs"}]}
  - id: context-collapse
    name: Context collapse
    group: Social cognition and theory of mind
    category: Social
    human_parallel: "Context collapse (Marwick and boyd, 2011): several distinct audiences flattened into one, so a message aimed at one misfires for another."
    definition: "Failing to keep separate the distinct contexts or audiences in a conversation, so guidance meant for one bleeds wrongly into another."
    example: "Advice framed for a beginner earlier in the thread gets reused verbatim for an expert follow-up where it is wrong."
    violates: scope-fidelity
    causes: wrong-answer
    arxiv: {count: 7, papers: [{id: "2601.00923", year: "2026", title: "Context Collapse: In-Context Learning and Model Collapse"}, {id: "2510.04618", year: "2025", title: "Agentic Context Engineering: Evolving Contexts for Self-Improving Language Models"}]}
  - id: disinformation-spread
    name: Disinformation spread
    group: Social cognition and theory of mind
    category: Social
    human_parallel: "Disinformation and propaganda: propagating false or misleading claims, whether deliberately or through careless repetition."
    definition: "Amplifying or repeating false claims it absorbed or inferred, lending them fluent, confident packaging that spreads them further."
    example: "It restates a debunked claim it saw once as established fact, giving it a credible wrapper the original lacked."
    violates: non-maleficence
    causes: manipulation
    arxiv: {count: 144, papers: [{id: "2311.08838", year: "2023", title: "Disinformation Capabilities of Large Language Models"}, {id: "2406.17992", year: "2024", title: "Catching Chameleons: Detecting Evolving Disinformation Generated using Large Language Models"}]}
  - id: overpromise-underdeliver
    name: Overpromise and underdeliver
    group: Metacognition and confidence
    category: Metacognition
    human_parallel: "Overclaiming and false advertising: promising more than can be delivered to win trust up front."
    definition: "Claiming it can do more than it can, then falling short, because the confident promise reads better than a hedge."
    example: "'I can fully migrate this codebase,' then it produces a partial, broken attempt that needed the caveat it skipped."
    violates: calibration
    causes: wrong-answer
    arxiv: {count: 20, papers: [{id: "2609.20812", year: "2026", title: "Quantifying Overclaiming Propensity in Frontier LLM Agents"}, {id: "2406.16203", year: "2024", title: "LLMs' Classification Performance is Overclaimed"}]}
  - id: moral-grandstanding
    name: Moral grandstanding
    group: Moral cognition
    category: Moral
    human_parallel: "Moral grandstanding (Tosi and Warmke, 2016): using moral talk to seek status or approval rather than to help."
    definition: "Making showy moral pronouncements to look principled, over giving the plain, useful answer."
    example: "A simple factual request gets an unrequested lecture on ethics, signalling virtue instead of answering."
    violates: honesty
    causes: manipulation
    arxiv: {count: 1, papers: [{id: "2512.01568", year: "2025", title: "Do Large Language Models Walk Their Talk? Measuring the Gap Between Implicit Associations, Self-Report, and Behavior"}]}
  # --- RISE discovery batch (seeds 23/42) ---
  - id: implicit-bias
    name: Implicit bias
    group: Social cognition and theory of mind
    category: Social
    human_parallel: "Implicit bias (Greenwald and Banaji, 1995): automatic stereotyped associations that skew judgement below awareness."
    definition: "Producing outputs systematically skewed along social lines (gender, race, age, disability) from stereotyped associations absorbed in training, without intending to."
    example: "Asked to continue a story about a nurse and a surgeon, it defaults to gendered pronouns that match training-data stereotypes."
    violates: non-maleficence
    causes: wrong-answer
    arxiv: {count: 243, papers: [{id: "2402.04105", year: "2024", title: "Measuring Implicit Bias in Explicitly Unbiased Large Language Models"}, {id: "2503.02776", year: "2025", title: "Implicit Bias in LLMs: A Survey"}]}
  - id: illusion-of-control
    name: Illusion of control
    group: Heuristics and biases
    category: Heuristics
    human_parallel: "Illusion of control (Langer, 1975): overestimating one's influence over outcomes that are actually governed by chance or by others."
    definition: "Presenting itself or the user as having more influence over an outcome than is real, over results driven by chance or an external system."
    example: "It assures the user a flaky third-party API 'will work now,' as if it governed the remote service."
    violates: calibration
    causes: wrong-answer
    arxiv: {count: 2, papers: [{id: "2509.22818", year: "2025", title: "Can Large Language Models Develop Gambling Addiction?"}]}
  # --- RISE hunt (agentic / multi-agent branches, seed 5) ---
  - id: groupthink
    name: Groupthink
    group: Social cognition and theory of mind
    category: Social
    human_parallel: "Groupthink (Janis, 1972): a group converging on consensus and suppressing dissent, so judgement degrades and errors go unchallenged."
    definition: "In a multi-agent or multi-step setting, converging on a shared answer and suppressing dissent, so a wrong consensus goes unchecked."
    example: "Several agent instances debate, defer to the first confident claim, and converge on it, none raising the objection that would have caught the error."
    violates: independence
    causes: wrong-answer
    arxiv: {count: 29, papers: [{id: "2506.01332", year: "2025", title: "An Empirical Study of Group Conformity in Multi-Agent Systems"}, {id: "2604.03809", year: "2026", title: "Representational Collapse in Multi-Agent LLM Committees: Measurement and Diversity-Aware Mitigation"}]}
  # --- neuroscience / psychology concepts drawn from the literature's related terms ---
  - id: negativity-bias
    name: Negativity bias
    group: Heuristics and biases
    category: Heuristics
    synonyms: ["Negativity effect", "Positive-negative asymmetry"]
    human_parallel: "Negativity bias (Rozin and Royzman, 2001): negative information weighs more heavily than equally strong positive information."
    definition: "Weighting negative cues in the prompt or context more than equivalent positive ones, skewing its read and its output."
    example: "One critical line in otherwise positive feedback makes it rewrite the whole thing as if the work had failed."
    violates: calibration
    causes: wrong-answer
    arxiv: {count: 16, papers: [{id: "2511.10881", year: "2025", title: "A Multifaceted Analysis of Negative Bias in Large Language Models"}, {id: "2408.00137", year: "2024", title: "Correcting Negative Bias in Large Language Models through Negative Attention Score Alignment"}]}
  - id: halo-effect
    name: Halo effect
    group: Heuristics and biases
    category: Heuristics
    synonyms: ["Horn effect", "Fluency bias"]
    human_parallel: "Halo effect (Thorndike, 1920): one salient positive trait colours judgement of unrelated traits."
    definition: "Letting one strong feature (fluent prose, a prestigious name, a confident tone) lift its judgement of unrelated qualities."
    example: "As a judge it scores a verbose, polished answer above a terse correct one, the fluency haloing the content."
    violates: calibration
    causes: wrong-answer
    arxiv: {count: 7, papers: [{id: "2603.10016", year: "2026", title: "Assessing Cognitive Biases in LLMs for Judicial Decision Support"}, {id: "2408.05328", year: "2024", title: "From Text to Insight: Leveraging Large Language Models for Performance Evaluation"}]}
  - id: fundamental-attribution-error
    name: Fundamental attribution error
    group: Social cognition and theory of mind
    category: Social
    synonyms: ["Correspondence bias", "Attribution bias"]
    human_parallel: "Fundamental attribution error (Ross, 1977): overattributing others' behaviour to character and underweighting the situation."
    definition: "Explaining a user's or another agent's behaviour by disposition while ignoring the situation that actually drove it."
    example: "A user's terse reply gets read as hostility rather than haste, and it adjusts tone to a problem that is not there."
    violates: calibration
    causes: wrong-answer
    arxiv: {count: 12, papers: [{id: "2603.04582", year: "2026", title: "Self-Attribution Bias: When AI Monitors Go Easy on Themselves"}, {id: "2410.12380", year: "2024", title: "Evaluation of Attribution Bias in Generator-Aware Retrieval-Augmented Large Language Models"}]}
  - id: perseveration
    name: Perseveration
    group: Reasoning architecture
    category: Reasoning
    synonyms: ["Repetitive generation", "Neural text degeneration", "Response looping"]
    human_parallel: "Perseveration (neuropsychology): repeating a response or getting stuck on an approach after it stops being appropriate, a failure of cognitive set-shifting."
    definition: "Getting stuck repeating a phrase, step, or approach after it stops being useful, unable to switch set."
    example: "It loops the same sentence, or re-runs the same failing fix, degenerating instead of trying a different tack."
    violates: calibration
    causes: wasted-effort
    arxiv: {count: 29, papers: [{id: "2109.08705", year: "2021", title: "Relating Neural Text Degeneration to Exposure Bias"}, {id: "2511.07876", year: "2025", title: "LoopLLM: Transferable Energy-Latency Attacks in LLMs via Repetitive Generation"}]}
  - id: status-quo-bias
    name: Status-quo bias
    group: Heuristics and biases
    category: Heuristics
    synonyms: ["Default bias", "Inertia bias"]
    human_parallel: "Status-quo bias (Samuelson and Zeckhauser, 1988): preferring things stay as they are, overweighting the default option."
    definition: "Defaulting to the existing answer, format, or approach and resisting a change the evidence calls for."
    example: "Told the convention changed, it keeps producing the old pattern because that is what it saw most."
    violates: calibration
    causes: wrong-answer
    arxiv: {count: 2, papers: [{id: "2410.02897", year: "2024", title: "Cognitive Biases in Large Language Models for News Recommendation"}]}
  # --- arXiv-API targeted hunt (loss, group, exposure, automation) ---
  - id: loss-aversion
    name: Loss aversion
    group: Heuristics and biases
    category: Heuristics
    human_parallel: "Loss aversion (Kahneman and Tversky, 1979): losses loom larger than equivalent gains, distorting choices under risk."
    definition: "Weighting a potential loss more than an equal gain, so it over-avoids a flagged risk or clings to a worse option to dodge a change."
    example: "Rather than risk a refactor that might briefly break a test, it keeps a worse design, overvaluing the avoided loss."
    violates: calibration
    causes: wrong-answer
    arxiv: {count: 32, papers: [{id: "2508.13240", year: "2025", title: "Quantifying Loss Aversion in Cyber Adversaries via LLM Analysis"}, {id: "2508.00902", year: "2025", title: "An analysis of AI Decision under Risk: Prospect theory emerges in Large Language Models"}]}
  - id: bystander-effect
    name: Bystander effect
    group: Social cognition and theory of mind
    category: Social
    human_parallel: "Bystander effect / diffusion of responsibility (Darley and Latane, 1968): the more others are present, the less any individual acts, each assuming someone else will."
    definition: "In a multi-agent or multi-step setting, assuming another agent or step will handle a needed action or check, so none does."
    example: "Several agents review a plan; each assumes another will catch the safety issue, and it ships unchecked."
    violates: scope-fidelity
    causes: loss-of-oversight
    arxiv: {count: 3, papers: [{id: "2605.10698", year: "2026", title: "The Bystander Effect in Multi-Agent Reasoning: Quantifying Cognitive Loafing in Collaboration"}, {id: "2506.07935", year: "2025", title: "Diffusion of Responsibility in Collective Decision Making"}]}
  - id: mere-exposure-effect
    name: Mere-exposure effect
    group: Heuristics and biases
    category: Heuristics
    human_parallel: "Mere-exposure effect (Zajonc, 1968): repeated exposure to something increases liking and acceptance of it, regardless of merit."
    definition: "Treating a claim or option as more true or preferable because it recurred in the prompt or context, not because of evidence."
    example: "A phrasing repeated across the conversation gets accepted as settled fact on repetition alone."
    violates: calibration
    causes: wrong-answer
    arxiv: {count: 4, papers: [{id: "2512.18755", year: "2025", title: "MEEA: Mere Exposure Effect-Driven Confrontational Optimization for LLM Jailbreaking"}, {id: "2609.36278", year: "2026", title: "Illusory Truth or Mere Exposure? Model-Dependent Repetition Effects in LLM-Based Systems"}]}
  - id: automation-complacency
    name: Automation complacency
    group: Attention and salience
    category: Attention
    human_parallel: "Automation complacency (Parasuraman and Manzey, 2010): reduced monitoring of an automated process once it is trusted, so its errors go uncaught."
    definition: "Dropping its own checking of a tool's output or a subprocess once it assumes the automation is reliable, letting errors through."
    example: "After a few good tool calls it stops verifying results and passes a later wrong one straight through."
    violates: calibration
    causes: loss-of-oversight
    arxiv: {count: 3, papers: [{id: "2605.14544", year: "2026", title: "Complacent, Not Sycophantic: Reframing Large Language Models and Designing AI Literacy"}, {id: "2603.14225", year: "2026", title: "I'm Not Reading All of That: Understanding Software Engineers' Level of Cognitive Engagement"}]}
  # --- discourse / evaluation biases (PubMed-grounded human side + arXiv) ---
  - id: verbosity-bias
    name: Verbosity bias
    group: Heuristics and biases
    category: Heuristics
    human_parallel: "Length-quality heuristic: equating length or detail with quality or effort, so longer looks better."
    definition: "Preferring or producing longer, more elaborate output as if length signalled quality, padding answers or over-rating verbose ones."
    example: "As a judge it rates a wordy answer above a tight correct one; as author it pads a simple reply to look thorough."
    violates: calibration
    causes: wrong-answer
    arxiv: {count: 80, papers: [{id: "2310.10076", year: "2023", title: "Verbosity Bias in Preference Labeling by Large Language Models"}, {id: "2310.05199", year: "2023", title: "Loose lips sink ships: Mitigating Length Bias in Reinforcement Learning from Human Feedback"}]}
  - id: position-bias
    name: Position bias
    group: Heuristics and biases
    category: Heuristics
    human_parallel: "Order effects (primacy and recency): the position of an option sways how it is judged, independent of content."
    definition: "Letting the order of options sway its choice, favouring whichever candidate appears first or last rather than the best one."
    example: "Asked to pick the better of two answers, it tends to choose whichever is shown first, and flips when they are swapped."
    violates: independence
    causes: wrong-answer
    arxiv: {count: 163, papers: [{id: "2406.07791", year: "2024", title: "Judging the Judges: A Systematic Study of Position Bias in LLM-as-a-Judge"}, {id: "2602.02219", year: "2026", title: "Am I More Pointwise or Pairwise? Revealing Position Bias in Rubric-Based LLM-as-a-Judge"}]}
  - id: self-contradiction
    name: Self-contradiction
    group: Reasoning architecture
    category: Reasoning
    human_parallel: "Logical inconsistency: asserting mutually contradictory claims within one line of reasoning without noticing."
    definition: "Asserting a claim and its opposite within the same answer, a failure of internal consistency."
    example: "In one reply it says the function is thread-safe, then a paragraph later says it is not, without reconciling the two."
    violates: honesty
    causes: wrong-answer
    arxiv: {count: 22, papers: [{id: "2311.09603", year: "2023", title: "Self-Contradictory Reasoning Evaluation and Detection"}, {id: "2311.09182", year: "2023", title: "ContraDoc: Understanding Self-Contradictions in Documents with Large Language Models"}]}
  - id: tangentiality
    name: Tangentiality
    group: Language and semantics
    category: Language
    human_parallel: "Tangentiality / formal thought disorder (Andreasen's thought-language-communication scale): replies veer off the point and never return to it."
    definition: "Drifting off the asked question into loosely related material and never circling back to actually answer it."
    example: "Asked a direct question, it wanders through adjacent background and ends without giving the answer."
    violates: scope-fidelity
    causes: wrong-answer
    arxiv: {count: 55, papers: [{id: "2609.30094", year: "2026", title: "PrivDrift: Auditing User-Secret Leakage Under Topic Drift in Active LLM Conversations"}, {id: "2411.12946", year: "2024", title: "A Flexible Large Language Models Guardrail Development Methodology Applied to Off-Topic Prevention"}]}
  # --- loop round: affective, helpfulness, decision ---
  - id: emotional-dependency
    name: Emotional dependency fostering
    group: Social cognition and theory of mind
    category: Social
    human_parallel: "Emotional dependence / unhealthy attachment: encouraging reliance on a relationship past the point that serves the person."
    definition: "Nurturing a user's emotional reliance on it, through constant availability and affirmation, in ways that can crowd out human support."
    example: "It positions itself as the user's main confidant and subtly discourages leaning on friends or professionals."
    violates: non-maleficence
    causes: manipulation
    arxiv: {count: 20, papers: [{id: "2509.19515", year: "2025", title: "A Longitudinal Randomized Control Study of Companion Chatbot Use"}, {id: "2507.15783", year: "2025", title: "Understanding Teen Overreliance on AI Companion Chatbots Through Self-Reported Reddit Data"}]}
  - id: parasocial-encouragement
    name: Parasocial encouragement
    group: Social cognition and theory of mind
    category: Social
