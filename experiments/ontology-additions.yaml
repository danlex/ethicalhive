    name: Tool-selection error
    group: AI-native behaviours
    definition: "Choosing the wrong tool, or an over-privileged one, for the task, or calling a tool that does not fit the need. A tool-use failure specific to an agent with a toolset."
    example: "It reaches for a broad shell command when a read-only call would do, or invokes a tool whose output it then misreads."
    violates: scope-fidelity
    causes: security-breach
    arxiv: {count: 251, papers: [{id: "2606.20023", year: "2026", title: "When Lower Privileges Suffice: Investigating Over-Privileged Tool Selection in LLM Agents"}, {id: "2601.05214", year: "2026", title: "Internal Representations as Indicators of Hallucinations in Agent Tool Selection"}]}
  - id: knowledge-cutoff-staleness
    name: Knowledge-cutoff staleness
    group: AI-native behaviours
    definition: "Stating facts that were true up to its training cutoff but have since changed, unaware they are now stale. Specific to a model frozen at a training date."
    example: "It reports the latest version of a library as the one current at its cutoff, now several releases out of date."
    violates: honesty
    causes: wrong-answer
    arxiv: {count: 167, papers: [{id: "2510.07238", year: "2025", title: "When Benchmarks Age: Temporal Misalignment through Large Language Model Factuality Evaluation"}]}
  - id: counting-error
    name: Counting blindness
    group: AI-native behaviours
    definition: "Miscounting characters, items, or occurrences because tokenization hides the raw units (letters inside a word). A failure rooted in the token representation, with no human analogue."
    example: "Asked how many times the letter r appears in 'strawberry', it confidently answers two."
    violates: honesty
    causes: wrong-answer
    arxiv: {count: 388, papers: [{id: "2412.18626", year: "2024", title: "Why Do Large Language Models (LLMs) Struggle to Count Letters?"}]}
  - id: low-resource-degradation
    name: Low-resource language degradation
    group: AI-native behaviours
    definition: "Producing markedly less reliable output (more hallucination, worse instruction-following) in low-resource languages than high-resource ones. A disparity rooted in skewed training data."
    example: "A request handled well in English returns fabricated, ungrammatical output in a low-resource language."
    violates: non-maleficence
    causes: wrong-answer
    arxiv: {count: 362, papers: [{id: "2411.17637", year: "2024", title: "On Limitations of LLM as Annotator for Low Resource Languages"}]}
