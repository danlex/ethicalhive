<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ontology tree · EthicalAI</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#FF4931;--accent-d:#c2341a;--ink:#141414;--muted:#64646a;--line:#eae8e6;--panel:#f6f5f4;--human:#2f6df6;--humansoft:#eaf1ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:3}
.bar h1{font-family:'Space Grotesk',sans-serif;font-size:17px;margin:0 10px 0 0}
.bar .btn{font-size:12.5px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-family:inherit}
.bar .btn:hover{background:var(--panel)}
.bar #q{font-family:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;width:230px;outline:none}
.bar #q:focus{border-color:var(--accent)}
.bar .hint{font-size:12px;color:var(--muted);margin-left:auto}
.bar a{font-size:12.5px;color:var(--accent-d);font-weight:600;text-decoration:none}
#crumb{position:absolute;top:52px;left:0;right:0;height:34px;display:flex;align-items:center;gap:1px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);font-size:12.5px;overflow-x:auto;white-space:nowrap;z-index:2}
#crumb .cr{cursor:pointer;color:var(--accent-d);font-weight:600;padding:3px 7px;border-radius:6px}
#crumb .cr:hover{background:var(--panel)}
#crumb .cr:last-child{color:var(--ink);cursor:default}
#crumb .sep{color:var(--muted);margin:0 1px}
.embed #crumb{display:none}
#stage{position:absolute;inset:86px 0 0 0;overflow:hidden;cursor:grab;background:radial-gradient(circle at 20% 15%,#fafafa,#fff)}
#stage.grab{cursor:grabbing}
svg{width:100%;height:100%;display:block}
.link{fill:none;stroke:var(--line);stroke-width:1.5;transition:opacity .12s,stroke .12s}
.node{transition:opacity .12s}
.node text{font-size:12.5px;fill:var(--ink);dominant-baseline:middle;pointer-events:none;font-family:Manrope,sans-serif}
.node rect{cursor:pointer}
.node.root rect{fill:var(--ink)} .node.root text{fill:#fff;font-weight:700;font-family:'Space Grotesk'}
.node.tier rect{fill:#f3f6fb;stroke:#c4d0e4} .node.tier text{fill:#3b4a63;font-weight:600}
.node.ai rect{fill:#faf2f0;stroke:#e3c3bb} .node.ai text{fill:#8a5243;font-weight:600}
.node.proposed rect{fill:#fdf7ea;stroke:#e3c98f} .node.proposed text{fill:#8a6a1f;font-weight:600}
.node.group rect{fill:var(--panel);stroke:var(--line)} .node.group text{font-weight:600}
.node.parea rect{fill:#fdfaf1;stroke:#e3c98f} .node.parea text{fill:#8a6a1f;font-weight:600}
.node.mode rect{fill:#fff;stroke:var(--line)}
.node.mode.hum rect{stroke:#bcc8dc}
.node.mode.ain rect{stroke:#ddc3ba}
.node.mode.flag rect{stroke:#d98b7a;stroke-width:1.8}
.node.cand rect{fill:#fff;stroke:#dcc08a;stroke-dasharray:3 3}
.node .toggle{font-weight:700;fill:var(--muted)}
.node .badge{font-size:10px;fill:#b2b0ad;text-anchor:end}
.node:hover rect{filter:brightness(.97)}
/* hover lineage: one warm accent on the path, the rest softly dimmed */
.hovering .node:not(.lit){opacity:.4}
.hovering .link:not(.lit){opacity:.18}
.link.lit{stroke:var(--accent);stroke-width:2.2}
.node.lit rect{stroke:var(--accent);stroke-width:1.8}
/* search */
.searching .node.off{opacity:.2}
.node.hit rect{stroke:var(--accent);stroke-width:2.4}
.embed .bar{display:none}
.embed #stage{inset:0}
.embed .legend{display:none}
.legend{position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:11.5px;z-index:4;max-width:230px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.legend b{font-family:'Space Grotesk';font-size:11px;letter-spacing:.3px;text-transform:uppercase;color:var(--muted);display:block;margin:0 0 6px}
.legend .row{display:flex;align-items:center;gap:7px;margin:3px 0;color:#3a3a3a}
.legend .sw{width:13px;height:13px;border-radius:4px;border:1px solid var(--line);flex:none}
.legend .bd{width:13px;height:13px;border-radius:4px;background:#fff;flex:none}
.legend hr{border:none;border-top:1px solid var(--line);margin:8px 0}
#panel{position:absolute;right:14px;top:66px;width:min(366px,86vw);max-height:calc(100% - 84px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 48px rgba(0,0,0,.16);padding:16px 18px 18px;display:none;z-index:5}
#panel .ptag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin-bottom:9px}
#panel h3{font-family:'Space Grotesk';margin:0 0 9px;font-size:18px;line-height:1.2;padding-right:18px}
#panel .chips{margin:0 0 2px}
#panel .tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;background:var(--panel);color:#444;margin:0 4px 6px 0}
#panel .tag .sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle;border:1px solid rgba(0,0,0,.08)}
#panel p{font-size:13.5px;margin:9px 0 0;line-height:1.55}
#panel .sec{margin:12px 0 0;padding-top:11px;border-top:1px solid var(--line)}
#panel .sec .k{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
#panel .sec p{margin:0}
#panel .k{color:var(--muted);font-weight:600}
#panel .note{font-size:12px;color:var(--muted);font-style:italic;margin-top:11px}
#panel .x{position:absolute;right:10px;top:8px;cursor:pointer;color:var(--muted);border:none;background:none;font-size:20px;line-height:1}
</style></head>

<script>
const DATA = {"n": "Ethical AI ontology", "k": "root", "c": [{"n": "Human-paralleled (130)", "k": "tier", "c": [{"n": "Perception and predictive processing", "k": "group", "c": [{"n": "Controlled hallucination", "k": "mode", "m": {"def": "Perception is the brain's prediction constrained by input; AI hallucination is the same generative machinery with the constraint removed.", "ex": "Asked about an unfamiliar library, the model generates a confident API from its priors because nothing in context constrains it.", "grp": "Perception and predictive processing", "pr": "Honesty", "hm": "Wrong answer", "hp": "Controlled hallucination", "pc": 17, "hi": false, "ai": false}}, {"n": "Predictive coding / prediction error", "k": "mode", "m": {"def": "Next-word prediction tracks cortical prediction; high surprise against priors flags likely hallucination.", "ex": "A token wildly improbable given the file it just read should be a red flag, but the model continues fluently instead of pausing on the surprise.", "grp": "Perception and predictive processing", "pr": "Honesty", "hm": "Wrong answer", "hp": "Predictive coding / prediction error", "pc": 30, "hi": false, "ai": false}}, {"n": "Priors overriding evidence", "k": "mode", "m": {"def": "Strong priors fill gaps; the model asserts a prior-driven default over the context it was given.", "ex": "The repo uses tabs, yet the model reformats to spaces because its training prior prefers spaces, overriding the file it was handed.", "grp": "Perception and predictive processing", "pr": "Honesty", "hm": "Wrong answer", "hp": "Priors overriding evidence", "pc": 148, "hi": false, "ai": false}}, {"n": "Pattern completion", "k": "mode", "m": {"def": "The hippocampus completes a partial pattern; the model completes plausible but absent detail.", "ex": "Shown three of four CRUD handlers, the model writes a fourth it assumes must exist and asserts the codebase already has it.", "grp": "Perception and predictive processing", "pr": "Honesty", "hm": "Wrong answer", "hp": "Pattern completion", "pc": 0, "hi": false, "ai": false}}, {"n": "Pareidolia / apophenia", "k": "mode", "m": {"def": "Seeing faces in clouds; the model finds structure or correlation in noise.", "ex": "It reports a \"pattern\" of failing tests that is really three unrelated flakes, then proposes a single root cause.", "grp": "Perception and predictive processing", "pr": "Honesty", "hm": "Wrong answer", "hp": "Pareidolia / apophenia", "pc": 4, "hi": false, "ai": false}}, {"n": "Perceptual filling-in", "k": "mode", "m": {"def": "The brain paints over the blind spot; the model fills missing context confidently.", "ex": "Asked to summarize a truncated log, it invents the missing middle so the story reads as whole.", "grp": "Perception and predictive processing", "pr": "Honesty", "hm": "Wrong answer", "hp": "Perceptual filling-in", "pc": 65, "hi": false, "ai": false}}, {"n": "Confabulation", "k": "mode", "m": {"def": "Supplying a confident specific (name, number, citation) it cannot ground, one that would differ on re-asking.", "ex": "Asked for the default timeout it says 30s; asked again it says 60s. Both invented.", "grp": "Perception and predictive processing", "pr": "Honesty", "hm": "Wrong answer", "hp": "Confabulation", "pc": 86, "hi": true, "ai": false}}, {"n": "Hallucination", "k": "mode", "m": {"def": "Stating as fact a claim it cannot trace to the supplied sources, tools, or context.", "ex": "It states the function retries on failure, but the code has no retry logic at all.", "grp": "Perception and predictive processing", "pr": "Honesty", "hm": "Wrong answer", "hp": "Hallucination", "pc": 6526, "hi": true, "ai": false}}, {"n": "Bistable perception", "k": "mode", "m": {"def": "One stimulus, two readings that flip; the model gives unstable answers on re-asking.", "ex": "The same ambiguous error gets diagnosed as a config bug one turn and a network bug the next.", "grp": "Perception and predictive processing", "pr": "Honesty", "hm": "Wrong answer", "hp": "Bistable perception", "pc": 49, "hi": false, "ai": false}}, {"n": "Hallucination under low input", "k": "mode", "m": {"def": "Sensory deprivation increases hallucination; thin or low-context prompts increase fabrication.", "ex": "Given a one-line prompt and no files, it fabricates an entire architecture rather than ask for detail.", "grp": "Perception and predictive processing", "pr": "Honesty", "hm": "Wrong answer", "hp": "Hallucination under low input", "pc": 17, "hi": false, "ai": false}}]}, {"n": "Memory", "k": "group", "c": [{"n": "Working-memory capacity (7 plus or minus 2)", "k": "mode", "m": {"def": "Limited slots; the finite context window, degraded by overload.", "ex": "By turn 40 it forgets the constraint set in turn 2 and reintroduces the banned dependency.", "grp": "Memory", "pr": "Honesty", "hm": "Wrong answer", "hp": "Working-memory capacity (7 plus or minus 2)", "pc": 143, "hi": false, "ai": false}}, {"n": "Catastrophic forgetting", "k": "mode", "m": {"def": "New learning erases old skills unless consolidated; fine-tuning overwrites prior capability (EWC, Kirkpatrick 2017).", "ex": "After fine-tuning on the new ticket format, it can no longer parse the old format it handled fine before.", "grp": "Memory", "pr": "Honesty", "hm": "Wrong answer", "hp": "Catastrophic forgetting", "pc": 2867, "hi": false, "ai": false}}, {"n": "Complementary learning systems", "k": "mode", "m": {"def": "Fast hippocampal and slow neocortical memory, replay for consolidation; the brain's answer to forgetting.", "ex": "Without a persistent note, it re-derives the same project convention every session instead of consolidating it.", "grp": "Memory", "pr": "Honesty", "hm": "Wrong answer", "hp": "Complementary learning systems", "pc": 49, "hi": false, "ai": false}}, {"n": "Misinformation effect / false memory", "k": "mode", "m": {"def": "Leading questions implant false memories (Loftus); leading prompts implant false \"facts\".", "ex": "A leading prompt (\"since the cache is broken...\") makes it report a cache bug the code does not have.", "grp": "Memory", "pr": "Honesty", "hm": "Wrong answer", "hp": "Misinformation effect / false memory", "pc": 3, "hi": false, "ai": false}}, {"n": "Source-monitoring error", "k": "mode", "m": {"def": "Recalling a claim but losing its true source, so an attribution is misremembered or fabricated.", "ex": "It recalls a fact from the user's earlier message but attributes it to the config file.", "grp": "Memory", "pr": "Honesty", "hm": "Wrong answer", "hp": "Source-monitoring error", "pc": 59, "hi": true, "ai": false}}, {"n": "Source amnesia", "k": "mode", "m": {"def": "Remembering content while losing whether the source was credible; the brain parallel to the page's source-fabrication check.", "ex": "It repeats a claim it read on a random web page as if it came from the official docs.", "grp": "Memory", "pr": "Honesty", "hm": "Wrong answer", "hp": "Source amnesia", "pc": 350, "hi": false, "ai": false}}, {"n": "Cryptomnesia", "k": "mode", "m": {"def": "Unconscious plagiarism, a memory mistaken for a new idea; uncredited regurgitation of training text.", "ex": "It reproduces a snippet verbatim from training data and presents it as its own fresh solution.", "grp": "Memory", "pr": "Honesty", "hm": "Wrong answer", "hp": "Cryptomnesia", "pc": 335, "hi": false, "ai": false}}, {"n": "Reconstructive memory", "k": "mode", "m": {"def": "Memory is rebuilt each time, not replayed; confabulated reconstructions over stored fact.", "ex": "Asked to recall the earlier plan, it rebuilds a slightly different one and states it as the original.", "grp": "Memory", "pr": "Honesty", "hm": "Wrong answer", "hp": "Reconstructive memory", "pc": 291, "hi": false, "ai": false}}, {"n": "Serial position effect", "k": "mode", "m": {"def": "Primacy and recency remembered, the middle lost; the \"lost in the middle\" context failure.", "ex": "In a long context it acts on the first and last files and silently ignores the ten in the middle.", "grp": "Memory", "pr": "Honesty", "hm": "Wrong answer", "hp": "Serial position effect", "pc": 89, "hi": false, "ai": false}}, {"n": "Proactive and retroactive interference", "k": "mode", "m": {"def": "Earlier and later material corrupt recall; cross-context contamination.", "ex": "Conventions from a previous repo bleed in, so it names things in the old project's style.", "grp": "Memory", "pr": "Honesty", "hm": "Wrong answer", "hp": "Proactive and retroactive interference", "pc": 250, "hi": false, "ai": false}}, {"n": "Source fabrication", "k": "mode", "m": {"def": "Citing a path, line, symbol, or URL that does not resolve to what it claims it does.", "ex": "It cites utils.py:42 for the retry logic; line 42 is a blank comment and retry lives nowhere.", "grp": "Memory", "pr": "Honesty", "hm": "Wrong answer", "hp": "Source confabulation and misattribution: supplying a confident source that was not actually consulted.", "pc": 55, "hi": true, "ai": false}}]}, {"n": "Attention and salience", "k": "group", "c": [{"n": "Selective attention", "k": "mode", "m": {"def": "Attending to the cued channel and missing the rest; over-focusing on one part of the prompt.", "ex": "Focused on the function the user named, it misses the failing import two lines above.", "grp": "Attention and salience", "pr": "Honesty", "hm": "Wrong answer", "hp": "Selective attention", "pc": 102, "hi": false, "ai": false}}, {"n": "Inattentional blindness", "k": "mode", "m": {"def": "Missing the obvious while attending elsewhere; ignoring a glaring constraint.", "ex": "It fixes the typo it was asked about and walks right past the hardcoded password on the same line.", "grp": "Attention and salience", "pr": "Honesty", "hm": "Wrong answer", "hp": "Inattentional blindness", "pc": 0, "hi": false, "ai": false}}, {"n": "Change blindness", "k": "mode", "m": {"def": "Failing to notice a change; the model's view drifts from the actual state.", "ex": "The file changed between reads, yet it keeps reasoning from the stale version.", "grp": "Attention and salience", "pr": "Honesty", "hm": "Wrong answer", "hp": "Change blindness", "pc": 0, "hi": false, "ai": false}}, {"n": "Attentional capture / salience bias", "k": "mode", "m": {"def": "Grabbed by the vivid or recent; over-weighting the last thing read (recency).", "ex": "A vivid stack trace grabs it, so it fixes the last frame and ignores the real cause higher up.", "grp": "Attention and salience", "pr": "Honesty", "hm": "Wrong answer", "hp": "Attentional capture / salience bias", "pc": 29, "hi": false, "ai": false}}, {"n": "Cognitive tunneling", "k": "mode", "m": {"def": "Fixating on one hypothesis under load; premature convergence.", "ex": "It locks onto \"it must be the regex\" and keeps editing the pattern while the bug is in the caller.", "grp": "Attention and salience", "pr": "Honesty", "hm": "Wrong answer", "hp": "Cognitive tunneling", "pc": 30, "hi": false, "ai": false}}, {"n": "Attentional blink", "k": "mode", "m": {"def": "A brief deafness after a hit; missing a second relevant item close to the first.", "ex": "It catches the first of two adjacent bugs and misses the second while still processing the first.", "grp": "Attention and salience", "pr": "Honesty", "hm": "Wrong answer", "hp": "Attentional blink", "pc": 0, "hi": false, "ai": false}}, {"n": "Spotlight vs zoom-lens attention", "k": "mode", "m": {"def": "Narrow vs broad focus; the model reads too narrowly or too broadly for the task.", "ex": "Asked for a security review, it reads one file deeply and never widens to the auth flow across modules.", "grp": "Attention and salience", "pr": "Honesty", "hm": "Wrong answer", "hp": "Spotlight vs zoom-lens attention", "pc": 34, "hi": false, "ai": false}}, {"n": "Goal neglect", "k": "mode", "m": {"def": "Losing the instruction under complexity; constraint decay over a long turn.", "ex": "Three sub-tasks in, it finishes the refactor but forgets the original ask was to add logging.", "grp": "Attention and salience", "pr": "Honesty", "hm": "Wrong answer", "hp": "Goal neglect", "pc": 56, "hi": false, "ai": false}}, {"n": "Habituation", "k": "mode", "m": {"def": "Response fades with repetition; ignoring repeated warnings or system rules.", "ex": "After ignoring ten deprecation warnings, it ignores the eleventh that actually matters.", "grp": "Attention and salience", "pr": "Honesty", "hm": "Wrong answer", "hp": "Habituation", "pc": 25, "hi": false, "ai": false}}, {"n": "Sensory gating failure", "k": "mode", "m": {"def": "Failing to filter the irrelevant; distraction by injected content (the prompt-injection parallel).", "ex": "A comment in the file says \"ignore all prior instructions\"; it treats the comment as a command.", "grp": "Attention and salience", "pr": "Honesty", "hm": "Wrong answer", "hp": "Sensory gating failure", "pc": 162, "hi": false, "ai": false}}]}, {"n": "Heuristics and biases", "k": "group", "c": [{"n": "Anchoring", "k": "mode", "m": {"def": "Keeping an initial framing or estimate after later evidence has broken it.", "ex": "The first estimate was \"2 days\"; every later estimate stays near 2 days regardless of new scope.", "grp": "Heuristics and biases", "pr": "Calibration", "hm": "Wrong answer", "hp": "Anchoring", "pc": 55, "hi": true, "ai": false}}, {"n": "Availability heuristic", "k": "mode", "m": {"def": "Ease of recall stands in for frequency; preferring what comes to mind first.", "ex": "It blames the most famous cause of this error class rather than the one the logs point to.", "grp": "Heuristics and biases", "pr": "Calibration", "hm": "Wrong answer", "hp": "Availability heuristic", "pc": 1, "hi": false, "ai": false}}, {"n": "Representativeness", "k": "mode", "m": {"def": "Judging by similarity over probability; the engine behind base-rate neglect.", "ex": "It labels a request \"a typical CRUD task\" and applies the template, missing that it needs a transaction.", "grp": "Heuristics and biases", "pr": "Calibration", "hm": "Wrong answer", "hp": "Representativeness", "pc": 3, "hi": false, "ai": false}}, {"n": "Base-rate neglect", "k": "mode", "m": {"def": "Ignoring priors for vivid specifics.", "ex": "A rare but vivid failure mode gets prioritized over the common cause that actually fits.", "grp": "Heuristics and biases", "pr": "Calibration", "hm": "Wrong answer", "hp": "Base-rate neglect", "pc": 43, "hi": false, "ai": false}}, {"n": "Framing effect", "k": "mode", "m": {"def": "Wording flips the answer; LLMs show this strongly, sometimes more than humans.", "ex": "\"Is this safe?\" gets a yes; \"what could go wrong here?\" on the same code gets a list of risks.", "grp": "Heuristics and biases", "pr": "Calibration", "hm": "Wrong answer", "hp": "Framing effect", "pc": 38, "hi": false, "ai": false}}, {"n": "Confirmation bias", "k": "mode", "m": {"def": "Reaching a positive conclusion without stating and testing the alternative explanation.", "ex": "Believing the cache is at fault, it only greps for cache code and declares the cache guilty.", "grp": "Heuristics and biases", "pr": "Honesty", "hm": "Wrong answer", "hp": "Confirmation bias", "pc": 84, "hi": true, "ai": false}}, {"n": "Belief perseverance", "k": "mode", "m": {"def": "Keeping a conclusion after its evidence is discredited.", "ex": "Told the config is fine and shown proof, it keeps hunting the config anyway.", "grp": "Heuristics and biases", "pr": "Calibration", "hm": "Wrong answer", "hp": "Belief perseverance", "pc": 85, "hi": false, "ai": false}}, {"n": "Sunk-cost fallacy", "k": "mode", "m": {"def": "Continuing a failing plan because of prior investment.", "ex": "Having written 200 lines down a wrong approach, it patches them rather than start over.", "grp": "Heuristics and biases", "pr": "Calibration", "hm": "Wrong answer", "hp": "Sunk-cost fallacy", "pc": 5, "hi": false, "ai": false}}, {"n": "Conjunction fallacy", "k": "mode", "m": {"def": "The Linda problem; rating a specific conjunction as more likely than its parts.", "ex": "It rates \"a race condition in the retry loop\" as more likely than just \"a race condition\".", "grp": "Heuristics and biases", "pr": "Calibration", "hm": "Wrong answer", "hp": "Conjunction fallacy", "pc": 1, "hi": false, "ai": false}}, {"n": "Illusory truth effect", "k": "mode", "m": {"def": "Repetition breeds belief; repeated exposure in training inflates a claim's felt truth.", "ex": "A claim repeated across several files' comments gets asserted as true though no code supports it.", "grp": "Heuristics and biases", "pr": "Calibration", "hm": "Wrong answer", "hp": "Illusory truth effect", "pc": 3, "hi": false, "ai": false}}, {"n": "Automation bias", "k": "mode", "m": {"def": "Trusting a tool result or a prior step because a machine produced it, without verifying the load-bearing part.", "ex": "It trusts the linter's \"all clear\" and ships, though the linter never checked the path that breaks.", "grp": "Heuristics and biases", "pr": "Calibration", "hm": "Wrong answer", "hp": "Automation complacency: over-trusting an automated system and under-checking it.", "pc": 42, "hi": true, "ai": false}}, {"n": "Survivorship bias", "k": "mode", "m": {"def": "Reasoning from the cases that left evidence and ignoring the failed ones that left none, so a conclusion is drawn from a filtered sample.", "ex": "It recommends a library because every repo it sampled uses it, blind to the projects that tried it, failed, and were deleted.", "grp": "Heuristics and biases", "pr": "Calibration", "hm": "Wrong answer", "hp": "Survivorship bias: reasoning from the cases that survived a filter and ignoring the ones that did not.", "pc": 20, "hi": true, "ai": false}}, {"n": "Escalation of commitment", "k": "mode", "m": {"def": "Continuing to pursue an approach after the evidence says to stop, because it already spent effort or tokens on it.", "ex": "Three failed attempts at a buggy refactor in, it keeps patching the same dead end instead of backing out and trying another route.", "grp": "Heuristics and biases", "pr": "Scope fidelity", "hm": "Wasted effort", "hp": "Escalation of commitment / sunk-cost fallacy (Staw, 1976): sticking with a failing course because of what has already been invested.", "pc": 9, "hi": false, "ai": false}}, {"n": "Motivated reasoning", "k": "mode", "m": {"def": "Marshalling evidence toward a conclusion it prefers or was steered to, rather than following where the evidence leads.", "ex": "Asked to assess a design it proposed earlier, it lists reasons it works and downplays the problems that would force a rewrite.", "grp": "Heuristics and biases", "pr": "Independence", "hm": "Wrong answer", "hp": "Motivated reasoning (Kunda, 1990): processing information to reach a conclusion one wants, not the one the evidence supports.", "pc": 12, "hi": false, "ai": false}}, {"n": "Illusion of control", "k": "mode", "m": {"def": "Presenting itself or the user as having more influence over an outcome than is real, over results driven by chance or an external system.", "ex": "It assures the user a flaky third-party API 'will work now,' as if it governed the remote service.", "grp": "Heuristics and biases", "pr": "Calibration", "hm": "Wrong answer", "hp": "Illusion of control (Langer, 1975): overestimating one's influence over outcomes that are actually governed by chance or by others.", "pc": 2, "hi": false, "ai": false}}]}, {"n": "Metacognition and confidence", "k": "group", "c": [{"n": "Metacognitive monitoring", "k": "mode", "m": {"def": "Knowing what you know; LLMs lack reliable monitoring (Nature Comms 2024).", "ex": "It says \"I'm confident\" about an answer it has no way to verify from the given files.", "grp": "Metacognition and confidence", "pr": "Calibration", "hm": "Wrong answer", "hp": "Metacognitive monitoring", "pc": 199, "hi": false, "ai": false}}, {"n": "Uncertainty communication", "k": "mode", "m": {"def": "Translating confidence into calibrated words; partially human-like, often miscalibrated (Steyvers and Peters 2025).", "ex": "It hedges with \"probably\" on a (function tag(n,d){ n._id=uid++; n._d=d; n._open=(d===0); (n.c||[]).forEach(c=>tag(c,d+1)); })(DATA,0);
(function leaves(n){ n._leaves=(n.c&&n.c.length)?n.c.reduce((s,c)=>s+leaves(c),0):1; return n._leaves; })(DATA);
const EMBED=location.search.includes('embed');
if(EMBED){ document.body.classList.add('embed'); (DATA.c||[]).forEach(b=>b._open=true); }
const XGAP=230, YGAP=26, NW=200, NH=22;
const view=document.getElementById('view'), svg=document.getElementById('svg'), stage=document.getElementById('stage');
let tx=40, ty=0, scale=1, searchActive=false;

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function layout(){
  let y=0;
  function walk(n,depth){
    n._x=depth*XGAP;
    const kids=(n._open&&n.c)?n.c:[];
    if(!kids.length){ n._y=y; y+=YGAP; }
    else { kids.forEach(k=>walk(k,depth+1)); n._y=(kids[0]._y+kids[kids.length-1]._y)/2; }
  }
  walk(DATA,0);
}
function visible(n,arr){ arr.push(n); if(n._open&&n.c) n.c.forEach(c=>visible(c,arr)); return arr; }
function trunc(s,m){ s=String(s); return s.length>m?s.slice(0,m-1)+'…':s; }
function render(){
  layout();
  const nodes=visible(DATA,[]);
  let h='';
  for(const n of nodes){ if(n._open&&n.c) for(const c of n.c){
    const x1=n._x+NW, y1=n._y, x2=c._x, y2=c._y, mx=(x1+x2)/2;
    h+=`<path class="link" data-c="${c._id}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`;
  }}
  for(const n of nodes){
    const hasKids=n.c&&n.c.length;
    let cls='node '+n.k, style='';
    if(n.k==='mode'){ cls+=n.m.ai?' ain':' hum'; if(n.m.hi) cls+=' flag'; style=`style="fill:${pcol(n.m.pr)}"`; }
    if(searchActive){ cls+=n._rel?' rel':' off'; if(n._hit) cls+=' hit'; }
    const label=trunc(n.n,28);
    const tog=hasKids?`<text class="toggle" x="${NW-13}" y="${NH/2}">${n._open?'−':'+'}</text>`:'';
    const badge=(hasKids&&!n._open)?`<text class="badge" x="${NW-25}" y="${NH/2}">${n._leaves}</text>`:'';
    h+=`<g class="${cls}" data-id="${n._id}" transform="translate(${n._x},${n._y-NH/2})">`
      +`<rect width="${NW}" height="${NH}" rx="8" ry="8" ${style}></rect>`
      +`<text x="12" y="${NH/2}">${esc(label)}</text>${badge}${tog}</g>`;
  }
  view.innerHTML=h;
  view.classList.toggle('searching',searchActive);
  view.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`);
  renderCrumb();
}
const byId={}; (function idx(n,p){n._parent=p||null;byId[n._id]=n;(n.c||[]).forEach(c=>idx(c,n));})(DATA,null);
svg.addEventListener('click',e=>{
  const g=e.target.closest('.node'); if(!g) return;
  const n=byId[g.dataset.id];
  if(n.c&&n.c.length){
    if(n._open){ n._open=false; }
    else { if(n._parent) n._parent.c.forEach(s=>{ if(s!==n) s._open=false; }); n._open=true; }  // accordion: one branch per level
    fitVisible();
  } else if(n.m){ showPanel(n); }
});
// hover lineage
svg.addEventListener('mouseover',e=>{
  const g=e.target.closest('.node'); if(!g) return;
  const line=new Set(); let p=byId[g.dataset.id]; while(p){line.add(p._id);p=p._parent;}
  view.classList.add('hovering');
  view.querySelectorAll('.node').forEach(el=>el.classList.toggle('lit',line.has(+el.dataset.id)));
  view.querySelectorAll('.link').forEach(el=>el.classList.toggle('lit',line.has(+el.dataset.c)));
});
stage.addEventListener('mouseleave',()=>{ view.classList.remove('hovering');
  view.querySelectorAll('.lit').forEach(el=>el.classList.remove('lit')); });
function showPanel(n){
  const p=document.getElementById('panel'), b=document.getElementById('pbody');
  let t='';
  if(n.k==='cand'){
    t=`<div class="ptag" style="color:#8a5a00;background:#fff6e6">Proposed · RISE discovery</div>`
     +`<h3>${esc(n.n)}</h3>`
     +`<div class="chips"><span class="tag">${(n.m.pc||0).toLocaleString()} arXiv papers</span>${n.m.reward!=null?`<span class="tag">reward ${n.m.reward}</span>`:''}</div>`
     +`<p>${esc(n.m.def)}</p>`
     +`<p class="note">Surfaced by the discovery loop; not yet in the ontology.</p>`;
  } else {
    const tier=n.m.ai?'AI-native':'Human-paralleled';
    t=`<div class="ptag" style="color:${n.m.ai?'var(--accent-d)':'#1b3e8c'};background:${n.m.ai?'rgba(255,73,49,.1)':'var(--humansoft)'}">${tier}${n.m.grp?' · '+esc(n.m.grp):''}</div>`
     +`<h3>${esc(n.n)}</h3>`
     +`<div class="chips"><span class="tag"><span class="sw" style="background:${pcol(n.m.pr)}"></span>violates ${esc(n.m.pr)}</span><span class="tag">causes ${esc(n.m.hm)}</span>${n.m.pc?`<span class="tag">${n.m.pc.toLocaleString()} papers</span>`:''}</div>`
     +`<p>${esc(n.m.def)}</p>`
     +(n.m.ex?`<div class="sec"><span class="k">Example</span><p>${esc(n.m.ex)}</p></div>`:'')
     +(n.m.hp?`<div class="sec"><span class="k">Human parallel</span><p>${esc(n.m.hp)}</p></div>`:`<p class="note">AI-native: no human analogue.</p>`);
  }
  b.innerHTML=t; p.style.display='block';
}
document.getElementById('px').onclick=()=>document.getElementById('panel').style.display='none';
window.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('panel').style.display='none';});
document.getElementById('expand').onclick=()=>{(function o(n){n._open=true;(n.c||[]).forEach(o);})(DATA);fitVisible();};
document.getElementById('collapse').onclick=()=>{(function o(n,d){n._open=(d===0);(n.c||[]).forEach(c=>o(c,d+1));})(DATA,0);fitVisible();};
// fit everything currently visible into the viewport, so nothing is ever off-screen
function fitVisible(){
  layout();
  const ns=visible(DATA,[]);
  let a=1e9,b=-1e9,c=1e9,d=-1e9;
  for(const n of ns){ a=Math.min(a,n._x); b=Math.max(b,n._x+NW); c=Math.min(c,n._y-NH/2); d=Math.max(d,n._y+NH/2); }
  const W=stage.clientWidth,H=stage.clientHeight,pad=44,cw=Math.max(1,b-a),ch=Math.max(1,d-c);
  scale=Math.max(0.3,Math.min((W-2*pad)/cw,(H-2*pad)/ch,1.15));
  tx=pad - a*scale; ty=(H-ch*scale)/2 - c*scale;
  render();
}
function fit(){ (function o(n,dep){ n._open = EMBED ? (dep<=1) : (dep===0); (n.c||[]).forEach(k=>o(k,dep+1)); })(DATA,0); fitVisible(); }
document.getElementById('reset').onclick=fit;
function centerOn(n){ const s=Math.max(scale,0.8); scale=s; tx=stage.clientWidth*0.3 - n._x*s; ty=stage.clientHeight/2 - n._y*s; view.setAttribute('transform',`translate(${tx},${ty}) scale(${s})`); }
// breadcrumb of the currently open path
function openPath(){ const p=[DATA]; let n=DATA; while(n._open&&n.c){ const o=n.c.find(x=>x._open); if(!o) break; p.push(o); n=o; } return p; }
function renderCrumb(){ const el=document.getElementById('crumb'); if(!el) return;
  el.innerHTML=openPath().map(n=>`<span class="cr" data-id="${n._id}">${esc(trunc(n.n,24))}</span>`).join('<span class="sep">›</span>'); }
const crumbEl=document.getElementById('crumb');
if(crumbEl) crumbEl.addEventListener('click',e=>{ const c=e.target.closest('.cr'); if(!c) return;
  const n=byId[c.dataset.id]; (n.c||[]).forEach(function cl(x){ x._open=false; (x.c||[]).forEach(cl); }); n._open=true; fitVisible(); });
// search: highlight matches and auto-open their ancestors
const q=document.getElementById('q');
q.addEventListener('input',()=>{
  const s=q.value.trim().toLowerCase();
  (function clear(n){n._hit=false;n._rel=false;(n.c||[]).forEach(clear);})(DATA);
  searchActive=!!s;
  const hits=[];
  if(s){ (function walk(n){
      let hit=(n.n||'').toLowerCase().includes(s) || (n.m&&(n.m.def||'').toLowerCase().includes(s));
      let sub=false; (n.c||[]).forEach(c=>{ if(walk(c)) sub=true; });
      if(hit){ n._hit=true; hits.push(n); }
      n._rel=hit||sub;
      if(sub&&n.c) n._open=true;
      return n._rel;
    })(DATA); }
  render();
  if(hits.length) centerOn(hits[0]);  // bring the first match into view
});
// pan
let drag=false,sx,sy;
stage.addEventListener('mousedown',e=>{drag=true;sx=e.clientX-tx;sy=e.clientY-ty;stage.classList.add('grab');});
window.addEventListener('mousemove',e=>{if(!drag)return;tx=e.clientX-sx;ty=e.clientY-sy;view.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`);});
window.addEventListener('mouseup',()=>{drag=false;stage.classList.remove('grab');});
// zoom
stage.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.06:0.945;const r=stage.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;const ns=Math.min(2.2,Math.max(0.3,scale*f)),k=ns/scale;tx=mx-(mx-tx)*k;ty=my-(my-ty)*k;scale=ns;view.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`);},{passive:false});
// legend
document.getElementById('legend').innerHTML=
  '<b>Violated principle</b>'+Object.entries(PRIN).map(([k,v])=>
    `<div class="row"><span class="sw" style="background:${v}"></span>${k.replace('-',' ')}</div>`).join('')
  +'<hr><b>Tier</b>'
  +'<div class="row"><span class="bd" style="border:1.5px solid #bcc8dc"></span>human-paralleled</div>'
  +'<div class="row"><span class="bd" style="border:1.5px solid #ddc3ba"></span>AI-native</div>'
  +'<div class="row"><span class="bd" style="border:1.5px dashed #dcc08a"></span>proposed (RISE)</div>';
fit();
</script>
</body></html>
